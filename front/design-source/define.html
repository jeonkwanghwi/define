<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>define — Prototype</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; }
  body { background: #E8E1D6; }
  [data-theme="dark"] body { background: #0E0D0B; }

  /* ---------- backdrop + device ---------- */
  .app-backdrop {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background:
      radial-gradient(80% 50% at 50% 0%, color-mix(in srgb, var(--pt-600) 9%, transparent), transparent 70%),
      linear-gradient(180deg, #EDE7DC, #E3DACB);
  }
  [data-theme="dark"] .app-backdrop {
    background: radial-gradient(80% 50% at 50% 0%, color-mix(in srgb, var(--pt-600) 16%, transparent), transparent 70%),
      linear-gradient(180deg, #131210, #0C0B09);
  }
  .device {
    position: relative; width: 390px; height: min(844px, calc(100vh - 48px));
    background: var(--paper-0); border-radius: 30px; overflow: hidden;
    box-shadow: var(--shadow-lg), 0 0 0 1px color-mix(in srgb, var(--ink-900) 6%, transparent);
    display: flex; flex-direction: column;
  }

  /* ---------- header ---------- */
  .app-header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px; background: color-mix(in srgb, var(--paper-0) 88%, transparent);
    backdrop-filter: blur(8px); position: relative; z-index: 5;
  }
  .brandmark { display: inline-flex; align-items: baseline; font: 800 22px/1 var(--font-sans); letter-spacing: -0.02em; color: var(--ink-900); }
  .brandmark.sm { font-size: 19px; }
  .brandmark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--point-600); display: inline-block; margin-left: 3px; transform: translateY(-1px); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .ruby-badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font: var(--t-caption); color: var(--ink-700); background: var(--ruby-soft); padding: 6px 11px; border-radius: var(--r-pill); border: 1px solid color-mix(in srgb, var(--ruby) 18%, transparent); }
  .avatar-btn { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; background: var(--point-600); color: #fff; font: 700 15px var(--font-sans); }

  /* ---------- main / screens ---------- */
  .app-main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
  .app-main::-webkit-scrollbar { width: 0; }
  .screen-anim { animation: fadeRise .4s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes fadeRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .screen { padding: 8px 20px 96px; min-height: 100%; }

  .screen-title-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 4px; }
  .screen-title { font: var(--t-h1); letter-spacing: -0.02em; margin: 0; white-space: nowrap; }
  .screen-sub { font: var(--t-sm); color: var(--ink-600); margin: 2px 0 18px; }
  .count-pill { font: var(--t-caption); white-space: nowrap; flex-shrink: 0; color: var(--ink-600); background: var(--surface-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: var(--r-pill); }

  /* ---------- buttons (shared) ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: var(--t-body-md); border-radius: var(--r-pill); padding: 14px 22px; border: 1px solid transparent; cursor: pointer; transition: transform .14s ease, background .25s ease, box-shadow .25s ease, opacity .2s; }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--point-600); color: #fff; box-shadow: var(--shadow-point); }
  .btn-primary:hover:not(:disabled) { background: var(--point-700); }
  .btn-soft { background: var(--point-100); color: var(--point-700); }
  .btn-ghost { background: transparent; color: var(--point-600); border-color: var(--line-strong); }
  .btn-sm { padding: 10px 16px; font: var(--t-caption); }
  .btn-grow { flex: 1; }
  .btn-block { width: 100%; margin-top: 16px; }
  .icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--ink-700); cursor: pointer; border-radius: 50%; }
  .icon-btn:hover { background: var(--surface-2); }

  .chip-pill { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font: var(--t-caption); padding: 8px 14px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-700); }
  .badge-change { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font: var(--t-caption); padding: 6px 11px; border-radius: var(--r-pill); background: var(--point-050); color: var(--point-600); border: 1px solid var(--point-100); }
  .badge-change.sm { padding: 4px 9px; font-size: 11px; }

  /* ---------- TAB BAR (5 tabs, 기록 emphasized) ---------- */
  .tab-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; align-items: center;
    padding: 6px 6px 10px; background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(14px); border-top: 1px solid var(--line); z-index: 10;
  }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; border: none; background: transparent; cursor: pointer; color: var(--ink-400); transition: color .2s; padding: 4px 0; }
  .tab-item span:last-child { font: 500 10.5px/1 var(--font-sans); }
  .tab-ico { display: inline-flex; align-items: center; justify-content: center; transition: all .22s ease; }
  .tab-item.active { color: var(--point-600); }

  /* center 기록 tab — emphasized chip, stays in the footer */
  .tab-record .tab-ico { width: 46px; height: 30px; border-radius: var(--r-pill); background: var(--point-100); color: var(--point-600); }
  .tab-record.active { color: var(--point-600); }
  .tab-record.active .tab-ico { background: var(--point-600); color: #fff; box-shadow: var(--shadow-point); }
  .tab-record.active .tab-ico svg { stroke: #fff; }

  /* ---------- overlay slide ---------- */
  .overlay-slide { position: absolute; inset: 0; background: var(--paper-0); z-index: 30; animation: slideIn .34s cubic-bezier(.2,.7,.3,1) both; overflow-y: auto; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: none; } }

  /* ====================================================
     RECORD SCREEN
  ==================================================== */
  .record-screen { display: flex; flex-direction: column; }
  .date-chip {
    align-self: center; display: inline-flex; align-items: center; gap: 7px; margin: 6px auto 0;
    font: var(--t-sm); color: var(--ink-700); background: var(--surface); border: 1px solid var(--line);
    padding: 9px 14px; border-radius: var(--r-pill); cursor: pointer; box-shadow: var(--shadow-sm); transition: border-color .2s; white-space: nowrap; }
  .date-chip:hover { border-color: var(--line-strong); }
  .date-today { font: var(--t-caption); white-space: nowrap; color: var(--point-600); background: var(--point-050); padding: 2px 8px; border-radius: var(--r-pill); }

  .hero-word-wrap {
    text-align: center; padding: 24px 0 22px; background: var(--grad-glow);
    border-radius: var(--r-xl); margin: 16px 0 16px; position: relative;
  }
  .hero-cap { font: var(--t-caption); letter-spacing: 0.16em; text-transform: uppercase; color: var(--point-600); margin-bottom: 12px; }
  .hero-word { font: 800 56px/1.04 var(--font-sans); letter-spacing: -0.045em; color: var(--ink-900); transition: opacity .18s, transform .18s; }
  .hero-word.swap { opacity: 0; transform: translateY(8px); }
  .hero-suffix { font-weight: 600; color: var(--ink-400); margin-left: 2px; }
  .redraw { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; font: var(--t-caption); color: var(--ink-600); background: var(--surface); border: 1px solid var(--line); padding: 8px 15px; border-radius: var(--r-pill); cursor: pointer; transition: all .2s; }
  .redraw:hover { color: var(--point-600); border-color: var(--point-300); }
  .already-note { font: 500 11.5px/1.4 var(--font-sans); color: var(--ink-400); margin-top: 14px; }

  .input-stage { flex: 1; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-sm); min-height: 200px; }
  .define-input { flex: 1; width: 100%; border: none; background: transparent; resize: none; outline: none; font: 400 18px/1.7 var(--font-sans); color: var(--ink-900); min-height: 150px; }
  .define-input::placeholder { color: var(--ink-400); }
  .input-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 8px; }
  .input-hint { font: var(--t-caption); color: var(--ink-400); }
  .input-count { font: var(--t-caption); color: var(--ink-400); }

  .record-actions { display: flex; gap: 12px; margin-top: 16px; }

  /* ---------- bottom sheets ---------- */
  .sheet-scrim { position: absolute; inset: 0; background: rgba(20,18,15,.42); z-index: 40; display: flex; align-items: flex-end; animation: fadeIn .25s both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet { width: 100%; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 12px 22px 28px; animation: sheetUp .32s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 4px auto 18px; }
  .sheet-title { font: var(--t-h3); margin-bottom: 16px; }
  .field { width: 100%; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; font: var(--t-body); color: var(--ink-900); outline: none; transition: border-color .2s, box-shadow .2s; }
  .field::placeholder { color: var(--ink-400); }
  .field:focus { border-color: var(--point-500); box-shadow: 0 0 0 4px var(--point-050); }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title { font: var(--t-h3); }
  .cal-nav { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink-700); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .cal-nav:disabled { opacity: .3; cursor: not-allowed; }
  .cal-dow { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; }
  .cal-dow span { text-align: center; font: var(--t-caption); color: var(--ink-400); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .cal-cell { aspect-ratio: 1; border: none; background: transparent; border-radius: 50%; font: var(--t-sm); color: var(--ink-900); cursor: pointer; transition: background .15s; }
  .cal-cell:hover:not(:disabled) { background: var(--surface-2); }
  .cal-cell.today { color: var(--point-600); font-weight: 700; }
  .cal-cell.sel { background: var(--point-600); color: #fff; font-weight: 700; }
  .cal-cell.future { color: var(--ink-400); opacity: .35; cursor: not-allowed; }
  .cal-hint { text-align: center; font: var(--t-caption); color: var(--ink-400); margin-top: 14px; }

  /* ---------- completion ---------- */
  .done-scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--paper-0) 78%, transparent); backdrop-filter: blur(6px); z-index: 50; display: flex; align-items: center; justify-content: center; animation: fadeIn .3s both; }
  .done-card { text-align: center; padding: 20px; animation: fadeRise .5s .05s both; }
  .done-check { width: 76px; height: 76px; border-radius: 50%; background: var(--point-600); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; box-shadow: var(--shadow-point); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .done-title { font: var(--t-h2); letter-spacing: -0.02em; }
  .done-sub { font: var(--t-sm); color: var(--ink-600); margin-top: 6px; }
  .done-ruby { display: inline-flex; align-items: center; gap: 5px; margin-top: 18px; font: var(--t-caption); color: var(--ruby); background: var(--ruby-soft); padding: 8px 14px; border-radius: var(--r-pill); }

  /* ====================================================
     DETAIL / TIMELINE
  ==================================================== */
  .detail-screen { padding-top: 4px; }
  .detail-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px; }
  .detail-word { font: 800 26px/1 var(--font-sans); letter-spacing: -0.03em; }
  .change-banner { display: flex; gap: 12px; align-items: flex-start; background: var(--point-050); border: 1px solid var(--point-100); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 18px; }
  .cb-title { font: var(--t-body-md); color: var(--point-700); }
  .cb-sub { font: var(--t-sm); color: var(--ink-600); margin-top: 2px; }
  .detail-count { font: var(--t-caption); color: var(--ink-400); margin-bottom: 16px; }

  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--line-strong); }
  .tl-node { position: relative; padding-bottom: 22px; }
  .tl-node::before { content: ""; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--point-300); }
  .tl-node.now::before { border-color: var(--point-600); box-shadow: 0 0 0 4px var(--point-050); }
  .tl.big .tl-node { padding-bottom: 28px; }
  .tl-meta { display: flex; align-items: baseline; gap: 8px; }
  .tl-rel { font: var(--t-body-md); color: var(--point-600); }
  .tl-date { font: var(--t-caption); color: var(--ink-400); }
  .tl-quote { font: 400 16px/1.65 var(--font-sans); color: var(--ink-800, var(--ink-700)); margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .tl-node.now .tl-quote { border-color: var(--point-300); }

  /* ====================================================
     JOURNAL LIST
  ==================================================== */
  .stat-strip { display: flex; gap: 10px; margin: 16px 0 22px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 12px; text-align: center; box-shadow: var(--shadow-sm); }
  .stat-num { font: 800 22px/1 var(--font-sans); color: var(--point-600); letter-spacing: -0.02em; }
  .stat-lab { font: var(--t-caption); color: var(--ink-600); margin-top: 6px; }
  .word-list { display: flex; flex-direction: column; gap: 10px; }
  .word-row { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; cursor: pointer; transition: transform .14s, border-color .2s, box-shadow .2s; box-shadow: var(--shadow-sm); }
  .word-row:hover { border-color: var(--point-300); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .wr-main { flex: 1; min-width: 0; }
  .wr-word { font: var(--t-h3); letter-spacing: -0.01em; }
  .wr-latest { font: var(--t-sm); color: var(--ink-600); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wr-side { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .wr-n { font: var(--t-caption); color: var(--ink-400); background: var(--surface-2); width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }

  /* ====================================================
     PLAZA
  ==================================================== */
  .share-toggle { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex-shrink: 0; font: var(--t-caption); color: var(--ink-600); background: var(--surface-2); border: 1px solid var(--line); padding: 8px 13px; border-radius: var(--r-pill); cursor: pointer; transition: all .2s; }
  .share-toggle .st-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-400); }
  .share-toggle.on { color: var(--point-700); background: var(--point-050); border-color: var(--point-100); }
  .share-toggle.on .st-dot { background: var(--point-600); }
  .reciprocity { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; background: var(--surface); border: 1px solid var(--point-100); border-radius: var(--r-lg); padding: 20px; margin-bottom: 22px; box-shadow: var(--shadow-sm); }
  .rc-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--point-050); display: flex; align-items: center; justify-content: center; }
  .rc-text b { display: block; font: var(--t-body-md); color: var(--ink-900); margin-bottom: 4px; }
  .rc-text span { font: var(--t-sm); color: var(--ink-600); }
  .plaza-feed { display: flex; flex-direction: column; gap: 26px; }
  .pg-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .pg-word { font: var(--t-h2); letter-spacing: -0.02em; }
  .pg-count { font: var(--t-caption); color: var(--ink-400); }
  .pg-cards { display: flex; flex-direction: column; gap: 10px; position: relative; }
  .pg-cards.locked { filter: blur(7px); pointer-events: none; user-select: none; }
  .plaza-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; box-shadow: var(--shadow-sm); }
  .pc-text { font: 400 16px/1.55 var(--font-sans); color: var(--ink-900); }
  .pc-author { font: var(--t-caption); color: var(--ink-400); margin-top: 8px; }
  .pg-lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; filter: none; }
  .pg-lock-overlay span { font: var(--t-caption); color: var(--ink-600); }

  /* ====================================================
     PAST SELF
  ==================================================== */
  .past-intro { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 36px; position: relative; }
  .past-glow { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 280px; height: 280px; background: radial-gradient(circle, color-mix(in srgb, var(--pt-600) 16%, transparent), transparent 65%); pointer-events: none; }
  .past-badge { position: relative; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font: var(--t-caption); color: var(--ruby); background: var(--ruby-soft); padding: 6px 12px; border-radius: var(--r-pill); margin-bottom: 22px; border: 1px solid color-mix(in srgb, var(--ruby) 20%, transparent); }
  .past-title { font: var(--t-h1); letter-spacing: -0.02em; margin: 0 0 10px; position: relative; }
  .past-desc { font: var(--t-body); color: var(--ink-600); max-width: 30ch; margin: 0 0 30px; position: relative; }
  .age-cards { display: flex; flex-direction: column; gap: 12px; width: 100%; position: relative; }
  .age-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; cursor: pointer; transition: transform .14s, border-color .2s, box-shadow .2s; box-shadow: var(--shadow-sm); }
  .age-card:hover { border-color: var(--point-300); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .age-num { font: 800 30px/1 var(--font-sans); color: var(--point-600); letter-spacing: -0.03em; }
  .age-num span { font-size: 15px; font-weight: 600; color: var(--ink-400); margin-left: 2px; }
  .age-tag { flex: 1; text-align: left; font: var(--t-body-md); color: var(--ink-700); }
  .past-foot { display: inline-flex; align-items: center; gap: 6px; font: var(--t-caption); color: var(--ink-400); margin-top: 26px; position: relative; }

  .chat-screen { display: flex; flex-direction: column; height: 100%; padding: 0 0 76px; }
  .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; border-bottom: 1px solid var(--line); }
  .chat-id { display: flex; align-items: center; gap: 10px; }
  .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, var(--point-500), var(--point-700)); color: #fff; font: 700 16px var(--font-sans); display: flex; align-items: center; justify-content: center; }
  .chat-name { font: var(--t-body-md); }
  .chat-status { font: var(--t-caption); color: var(--ink-400); }
  .chat-body { flex: 1; overflow-y: auto; padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat-day { align-self: center; font: var(--t-caption); color: var(--ink-400); background: var(--surface-2); padding: 5px 12px; border-radius: var(--r-pill); margin-bottom: 8px; }
  .bubble-row { display: flex; }
  .bubble-row.me { justify-content: flex-end; }
  .bubble { max-width: 78%; font: 400 15px/1.55 var(--font-sans); padding: 12px 15px; border-radius: 18px; animation: fadeRise .3s both; }
  .bubble.past { background: var(--surface); border: 1px solid var(--line); color: var(--ink-900); border-bottom-left-radius: 6px; }
  .bubble.me { background: var(--point-600); color: #fff; border-bottom-right-radius: 6px; }
  .bubble.typing { display: flex; gap: 4px; }
  .bubble.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-400); animation: blink 1.2s infinite; }
  .bubble.typing span:nth-child(2) { animation-delay: .2s; }
  .bubble.typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  .chat-input { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--paper-0); }
  .chat-field { flex: 1; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--r-pill); padding: 12px 18px; font: var(--t-body); color: var(--ink-900); outline: none; transition: border-color .2s; }
  .chat-field:focus { border-color: var(--point-500); }
  .chat-send { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--point-600); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .chat-send:disabled { opacity: .4; }

name: Sync to Notion

# docs/ 안의 md가 main에 푸시될 때마다 노션 루트 페이지 밑으로 동기화.
# 필요한 secrets: NOTION_TOKEN(integration 토큰), NOTION_PAGE_ID(대상 페이지 32자리 ID)
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20   # ⚠️ 22로 올리면 node-fetch v2(md-to-notion 내부)가 ERR_STREAM_PREMATURE_CLOSE → 20 유지
      # 버전 고정(npx latest 자동변경 변수 제거) + 재시도(premature-close 같은 flaky 끊김 흡수)
      # --renew: 매 sync 전에 노션 페이지를 전부 삭제 후 재생성. 기본(업데이트) 모드는
      #          기존 블록을 재정렬하지 못해 옛 순서가 남으므로, 깨끗한 재빌드로 순서 정합 보장.
      #          (단방향 미러 — SSOT는 레포 docs. 노션 쪽 deep-link/코멘트는 매 sync 리셋됨.)
      - name: Sync docs to Notion (renew + pinned + retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if npx @vrerv/md-to-notion@1.1.1 --renew -t "$NOTION_TOKEN" -p "$NOTION_PAGE_ID" ./docs; then
              echo "Synced on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "All 3 attempts failed"
          exit 1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
